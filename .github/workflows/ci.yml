name: CI

on:
  push:
    branches: [main, revive]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # dbus-daemon backs the private-bus notification tests; without it they are inconclusive.
      - name: Test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus

      - name: Build
        run: dotnet build YAPA.sln -c Release

      - name: Test
        run: dotnet test YAPA.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish linux-x64
        run: dotnet publish YAPA.Avalonia/YAPA.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=none -o out/yapa2

      - uses: actions/upload-artifact@v4
        with:
          name: yapa2-linux-x64
          path: out/yapa2
